<svg id="icon-path-favourite-loading" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
<style>
#icon-path-favourite-loading {
  stroke-dasharray: 40;
  stroke-dashoffset: 80;
  stroke-linecap: round;
  animation: favourite-loading 1s linear infinite;
}
@keyframes favourite-loading {
  0% {
    stroke-dashoffset: 80;
  }

  100% {
    stroke-dashoffset: 160;
  }
}

@keyframes favourite-loaded {
  0% {
    fill-opacity: 0;
    transform: scale(1);
  }

  50% {
    transform: scale(1.25);
  }

  100% {
    fill-opacity: 1;
    transform: scale(1);
  }
}
  </style>
